name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -NoNewline "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ProjectPilot-v${{ github.ref_name }}-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2.3.3
        with:
          generate_release_notes: true
          body: |
            ProjectPilot v1.0.0 提供完全离线的本机 SQLite 项目、任务、甘特图、会议、风险、Files & Links 与数据备份管理。

            请使用随附 `SHA256SUMS.txt` 校验安装包。Windows 安装包未签名，SmartScreen 提示时仅在确认文件来自本官方 GitHub Release 后继续。
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
