[package]
name = "projectpilot"
version = "1.1.0"
description = "ProjectPilot — local-first desktop project management"
authors = ["Racliu <rliubp@connect.ust.hk>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "projectpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["windows-desktop-host"]
windows-desktop-host = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
thiserror = "2"
sha2 = "0.10"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55.0"
